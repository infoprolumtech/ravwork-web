<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/ravwork_logo_icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">

    content="Collect client info, automate questions, and manage all leads in one place — with a simple link that works like your own mini-website." />
  <link rel="canonical" href="https://www.ravwork.link/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.ravwork.link/" />
  <meta property="og:title" content="RavworkLink" />
  <meta property="og:description"
    content="Collect client info, automate questions, and manage all leads in one place — with a simple link that works like your own mini-website." />

  <meta property="twitter:title" content="RavworkLink" />
  <meta property="twitter:description"

  <meta property="twitter:image" content="https://www.ravwork.link/assets/icons/ravwork_logo_icon.svg" />

  <!-- Schema.org for Google -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RavworkLink",
      "url": "https://www.ravwork.link/",
      "description": "Collect client info, automate questions, and manage all leads in one place — with a simple link that works like your own mini-website.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.ravwork.link/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
